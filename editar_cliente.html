{% extends "base.html" %}
{% block title %}Editar cliente{% endblock %}
{% block h1 %}Editar Cliente{% endblock %}
{% block subtitle %}Actualiza los datos del cliente{% endblock %}
{% block content %}
<section class="card">
  <h2>Editar cliente</h2>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div class="form-grid">
      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" value="{{ cliente.nombre }}" required minlength="2" maxlength="120" data-no-blank>
      </div>
      <div class="form-group">
        <label for="documento">Documento</label>
        <input type="text" id="documento" name="documento" value="{{ cliente.documento }}" required minlength="5" maxlength="20" pattern="[0-9A-Za-z\-]{5,20}" title="5 a 20 caracteres: letras, números o guion">
      </div>
      <div class="form-group">
        <label for="telefono">Teléfono (opcional)</label>
        <input type="tel" id="telefono" name="telefono" value="{{ cliente.telefono or '' }}" maxlength="20" pattern="[0-9+\s\-]{7,20}" title="Solo números, espacios, + o guion">
      </div>
      <div class="form-group">
        <label for="email">Correo (opcional)</label>
        <input type="email" id="email" name="email" value="{{ cliente.email or '' }}" maxlength="120">
      </div>
    </div>
    <p class="centrado">
      <button class="btn" type="submit">Actualizar</button>
      <a class="btn btn-secondary" href="{{ url_for('clientes') }}">Cancelar</a>
    </p>
  </form>
</section>
{% endblock %}
