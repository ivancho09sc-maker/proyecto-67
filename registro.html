{% extends "base.html" %}
{% block title %}Registro{% endblock %}
{% block extra_head %}<link rel="stylesheet" href="{{ url_for('static', filename='styleregistrer.css') }}">{% endblock %}
{% block header %}{% endblock %}
{% block content %}
  <div class="form-container">
    <h2>Crear cuenta</h2>
    <form method="post" action="{{ url_for('registro') }}">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required minlength="2" maxlength="120" data-no-blank>

      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" placeholder="ejemplo@email.com" required maxlength="120">

      <label for="password">Contraseña (mínimo 8 caracteres)</label>
      <input type="password" id="password" name="password" placeholder="********" required minlength="8" autocomplete="new-password">

      <label for="confirmar">Confirmar contraseña</label>
      <input type="password" id="confirmar" name="confirmar" placeholder="********" required minlength="8" autocomplete="new-password">

      <button type="submit">Registrarse</button>

      <p class="alt-link">¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a></p>
    </form>
  </div>
{% endblock %}
